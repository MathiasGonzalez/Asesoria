name: Deploy Worker & Static Assets
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile and Build Client Assets
        run: npm run build

      # PRE-DEPLOYMENT REQUIREMENT: Apply Remote D1 SQL Schema Migrations
      # Essential to avoid silent failures due to missing token edit permissions.
      # Ensure CLOUDFLARE_API_TOKEN possesses Account -> D1 -> Edit scope.
      - name: Apply D1 Database Migrations
        run: npx wrangler d1 migrations apply uy_tax_db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NO_D1_WARNING: "true"

      - name: Deploy Worker to Cloudflare Global Edge
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
